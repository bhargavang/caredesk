# Each test context gets its own in-memory database, so contexts never see each other's data.
spring:
  datasource:
    url: jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
  main:
    banner-mode: off

caredesk:
  jwt:
    secret: test-secret-that-is-at-least-32-characters-long
    cookie-secure: true
  jobs:
    enabled: false
  seed:
    enabled: false
  rate-limit:
    enabled: false

logging:
  level:
    com.bhargavang.caredesk.notify.LoggingEmailSender: warn
