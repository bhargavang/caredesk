# Runs Postgres, the API and the website together. Needs a .env file (copy .env.example).
#   docker compose up --build
# Then open http://localhost:8081
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caredesk
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caredesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d caredesk"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/caredesk
      DATABASE_USERNAME: caredesk
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-caredesk}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      FORWARD_HEADERS_STRATEGY: framework
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      MAIL_MODE: ${MAIL_MODE:-log}
      MAIL_FROM: ${MAIL_FROM:-CareDesk <no-reply@caredesk.test>}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
